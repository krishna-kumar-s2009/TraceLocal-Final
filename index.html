<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceLocal | Product Journey Tracker</title>
    <!-- Load React, ReactDOM, Babel, and Tailwind CSS -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home');

            const Home = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center px-4">
                    <h1 className="text-4xl font-bold text-white mb-4">Meet <span className="text-teal-400">TraceLocal</span></h1>
                    <p className="text-xl mb-8">Scan it. Trace it. Trust it.</p>
                    <div className="bg-slate-800 p-8 rounded-xl border border-slate-700 max-w-md w-full">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=TraceLocal-HNY-001&color=0f172a&bgcolor=2dd4bf" alt="QR Code" className="mx-auto rounded-lg mb-6 shadow-lg" />
                        <h2 className="text-2xl font-semibold mb-2">Local Honey</h2>
                        <p className="text-slate-400 mb-6">Batch: HNY-001 • Tamil Nadu</p>
                        <button onClick={() => setView('history')} className="w-full bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold py-3 rounded-lg transition-colors">
                            Scan & Verify Journey
                        </button>
                    </div>
                </div>
            );

            const History = () => (
                <div className="max-w-2xl mx-auto py-12 px-4">
                    <button onClick={() => setView('home')} className="text-teal-400 mb-8 hover:underline">← Back to Home</button>
                    <h2 className="text-3xl font-bold text-white mb-8">Recorded History</h2>
                    <div className="bg-slate-800 rounded-xl border border-slate-700 p-6">
                        <div className="border-l-2 border-teal-500 pl-6 pb-6 relative">
                            <div className="absolute w-4 h-4 bg-teal-500 rounded-full -left-[9px] top-0"></div>
                            <p className="font-bold text-white">Registered</p>
                            <p className="text-sm text-slate-400">10:10 AM • Origin: Ponneri, Tamil Nadu</p>
                        </div>
                        <div className="border-l-2 border-teal-500 pl-6 pb-6 relative">
                            <div className="absolute w-4 h-4 bg-teal-500 rounded-full -left-[9px] top-0"></div>
                            <p className="font-bold text-white">Packed</p>
                            <p className="text-sm text-slate-400">11:25 AM</p>
                        </div>
                        <div className="border-l-2 border-teal-500 pl-6 pb-6 relative">
                            <div className="absolute w-4 h-4 bg-teal-500 rounded-full -left-[9px] top-0"></div>
                            <p className="font-bold text-white">Inspected</p>
                            <p className="text-sm text-slate-400">1:05 PM</p>
                        </div>
                        <div className="pl-6 relative">
                            <div className="absolute w-4 h-4 bg-teal-500 rounded-full -left-[9px] top-0 shadow-[0_0_10px_#2dd4bf]"></div>
                            <p className="font-bold text-teal-400">Delivered</p>
                            <p className="text-sm text-slate-400">4:30 PM • Verified by Smart Contract</p>
                        </div>
                    </div>
                    <p className="text-xs text-slate-500 mt-6 text-center">Hackathon Solution Environment</p>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <nav className="border-b border-slate-800 p-4">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <span className="text-xl font-bold text-white">Trace<span className="text-teal-400">Local</span></span>
                            <span className="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">Live</span>
                        </div>
                    </nav>
                    {view === 'home' ? <Home /> : <History />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
